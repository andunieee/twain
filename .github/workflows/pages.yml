name: pages

on:
  push:
    branches: [master]
    paths: [README.md, screenshot.png, site.css, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Render README.md into a page
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          mkdir _site
          cp screenshot.png site.css flatpak/io.github.andunieee.twain.svg _site/
          printf '<link rel="icon" href="io.github.andunieee.twain.svg">\n' > "$RUNNER_TEMP/header.html"
          pandoc README.md --standalone --css site.css --metadata pagetitle=twain \
            --include-in-header="$RUNNER_TEMP/header.html" \
            -o _site/index.html

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
