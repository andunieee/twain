[package]
name = "twain"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
# Keep the libadwaita floor at 1.5 (the version Ubuntu 24.04 ships) so the
# binary release job builds on stock runners. The only 1.6 API we used was
# AdwSpinner, which GtkSpinner covers.
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
pangocairo = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2.7"
sourceview5 = "0.11"
tree-sitter = { version = "0.27.1", features = ["wasm"] }
tree-sitter-highlight = "0.27.1"
ureq = "3.4.2"
